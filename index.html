const SECTIONS=[...new Set(DB.map(x=>x.s))];
const STORE_KEY="tma1_exam_history";
const THEME_KEY="tma1_theme";
let state={screen:"setup",config:null,pool:[],idx:0,score:0,answers:[],locked:false};

function saveTheme(t){localStorage.setItem(THEME_KEY,t);document.documentElement.classList.toggle("dark",t==="dark")}
function loadTheme(){const t=localStorage.getItem(THEME_KEY)||"dark";saveTheme(t)}
function toggleTheme(){saveTheme(document.documentElement.classList.contains("dark")?"light":"dark")}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normalize(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim()}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function getHistory(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch(e){return []}}
function pushHistory(session){const h=getHistory();h.unshift(session);localStorage.setItem(STORE_KEY,JSON.stringify(h.slice(0,60)))}

function render(){
  const app=document.getElementById("app");
  if(state.screen==="setup")app.innerHTML=viewSetup();
  else if(state.screen==="exam")app.innerHTML=viewExam();
  else if(state.screen==="results")app.innerHTML=viewResults();
  else if(state.screen==="history")app.innerHTML=viewHistory();
  bindEvents();
}

function header(showBack){
  return `<header class="flex items-center justify-between px-5 py-4 border-b" style="border-color:var(--border)">
    <div class="flex items-center gap-3">
      ${showBack?'<button id="btnBack" class="tag px-2 py-1 rounded text-xs">← Salir</button>':''}
      <div>
        <div class="font-display font-semibold text-lg leading-none">TMA-I <span style="color:var(--accent)">Simulador</span></div>
        <div class="text-[11px] font-mono uppercase tracking-wider" style="color:var(--muted)">Herramienta de práctica no oficial</div>
      </div>
    </div>
    <button id="btnTheme" class="tag px-3 py-2 rounded-full text-xs">${document.documentElement.classList.contains("dark")?"☀ Claro":"● Oscuro"}</button>
  </header>`;
}

function viewSetup(){
  const hist=getHistory();
  return `<div class="flex-1 flex flex-col">
    ${header(false)}
    <main class="flex-1 max-w-2xl w-full mx-auto px-5 py-8 fade-in">
      <div class="tag inline-block px-3 py-1 rounded text-[11px] mb-4">FICHA · TMA-I · ${DB.length} PREGUNTAS DISPONIBLES</div>
      <h1 class="font-display text-3xl font-semibold mb-2">Prepárate para tu examen TMA-I</h1>
      <p class="text-sm mb-8" style="color:var(--muted)">Este simulador es una herramienta de práctica independiente y <strong>no oficial</strong>. No está afiliado ni avalado por el INAC ni por ninguna organización de mantenimiento aeronáutico. Úsalo únicamente como apoyo de estudio.</p>

      <label class="block text-xs font-mono uppercase tracking-wider mb-2" style="color:var(--muted)">Nombre del aspirante</label>
      <input id="inpName" type="text" placeholder="Escribe tu nombre" maxlength="40" class="w-full px-4 py-3 rounded-lg mb-6 card outline-none" style="background:var(--surface)">

      <label class="block text-xs font-mono uppercase tracking-wider mb-2" style="color:var(--muted)">Modelo de examen</label>
      <div class="grid sm:grid-cols-3 gap-3 mb-6">
        ${modeCard("simple","Selección simple","Elige entre opciones marcadas A, B, C…")}
        ${modeCard("completar","A completar","Toca la respuesta correcta sin ver las letras")}
        ${modeCard("escribir","Escribir respuesta","Escribe la letra de la opción correcta")}
      </div>

      <label class="block text-xs font-mono uppercase tracking-wider mb-2" style="color:var(--muted)">Materias (opcional)</label>
      <div id="sectionChips" class="flex flex-wrap gap-2 mb-6">
        ${SECTIONS.map(s=>`<span class="chip active tag px-3 py-1.5 rounded-full text-xs" data-sec="${esc(s)}">${esc(s)}</span>`).join("")}
      </div>

      <label class="block text-xs font-mono uppercase tracking-wider mb-2" style="color:var(--muted)">Cantidad de preguntas</label>
      <div class="flex flex-wrap gap-2 mb-3">
        ${[10,20,30,50,100].map(n=>`<button class="qtyBtn tag px-4 py-2 rounded-lg text-sm" data-n="${n}">${n}</button>`).join("")}
        <button id="qtyAll" class="tag px-4 py-2 rounded-lg text-sm">Todas</button>
      </div>
      <input id="inpQty" type="number" min="5" max="${DB.length}" value="20" class="w-32 px-3 py-2 rounded-lg card outline-none mb-8">

      <button id="btnStart" class="btn-accent w-full py-4 rounded-lg font-semibold text-base">Comenzar examen</button>

      ${hist.length?`<button id="btnHistory" class="btn-outline w-full py-3 rounded-lg mt-3 text-sm">Ver historial (${hist.length})</button>`:""}
    </main>
    <footer class="text-center text-[11px] font-mono py-4" style="color:var(--muted)">Contenido con fines exclusivamente educativos y de práctica</footer>
  </div>`;
}

function modeCard(id,title,desc){
  return `<button class="modeCard card p-4 rounded-lg text-left" data-mode="${id}">
    <div class="font-semibold text-sm mb-1">${title}</div>
    <div class="text-xs" style="color:var(--muted)">${desc}</div>
  </button>`;
}

function bindSetupEvents(){
  let mode="simple";
  document.querySelectorAll(".modeCard").forEach(el=>{
    if(el.dataset.mode===mode)el.style.borderColor="var(--accent)";
    el.onclick=()=>{document.querySelectorAll(".modeCard").forEach(c=>c.style.borderColor="var(--border)");el.style.borderColor="var(--accent)";mode=el.dataset.mode};
  });
  document.querySelectorAll(".chip").forEach(el=>{
    el.onclick=()=>el.classList.toggle("active");
  });
  document.querySelectorAll(".qtyBtn").forEach(el=>{
    el.onclick=()=>document.getElementById("inpQty").value=el.dataset.n;
  });
  document.getElementById("qtyAll").onclick=()=>{
    const active=[...document.querySelectorAll(".chip.active")].map(c=>c.dataset.sec);
    const count=DB.filter(q=>active.includes(q.s)).length;
    document.getElementById("inpQty").value=count;
  };
  document.getElementById("btnTheme").onclick=toggleTheme;
  document.getElementById("btnHistory")&&(document.getElementById("btnHistory").onclick=()=>{state.screen="history";render()});
  document.getElementById("btnStart").onclick=()=>{
    const name=document.getElementById("inpName").value.trim()||"Aspirante";
    const active=[...document.querySelectorAll(".chip.active")].map(c=>c.dataset.sec);
    const sections=active.length?active:SECTIONS;
    let qty=parseInt(document.getElementById("inpQty").value,10)||20;
    const available=DB.filter(q=>sections.includes(q.s));
    qty=Math.min(Math.max(qty,1),available.length);
    if(!available.length){alert("Selecciona al menos una materia.");return}
    state.config={name,mode,sections,qty};
    state.pool=shuffle(available).slice(0,qty).map(q=>({...q,order:shuffle(Object.keys(q.o))}));
    state.idx=0;state.score=0;state.answers=[];state.locked=false;
    state.screen="exam";render();
  };
}

function gauge(){
  const total=state.pool.length;
  return `<div class="flex gap-1 px-5 py-3">${state.pool.map((_,i)=>`<div class="h-1.5 flex-1 rounded-full gauge-seg ${i<state.idx?"filled":""}"></div>`).join("")}</div>`;
}

function viewExam(){
  const q=state.pool[state.idx];
  const mode=state.config.mode;
  let body="";
  if(mode==="simple"){
    body=q.order.map(k=>`<button class="opt w-full text-left px-4 py-3 rounded-lg mb-2.5 flex gap-3" data-key="${k}">
      <span class="font-mono font-semibold" style="color:var(--accent)">${k}</span><span class="text-sm">${esc(q.o[k])}</span>
    </button>`).join("");
  }else if(mode==="completar"){
    body=q.order.map(k=>`<button class="opt w-full text-left px-4 py-3 rounded-lg mb-2.5 text-sm" data-key="${k}">${esc(q.o[k])}</button>`).join("");
  }else{
    body=`<div class="mb-3">${q.order.map(k=>`<div class="text-sm mb-1.5"><span class="font-mono font-semibold mr-2" style="color:var(--accent)">${k}</span>${esc(q.o[k])}</div>`).join("")}</div>
      <div class="flex gap-2">
        <input id="writeInput" maxlength="2" placeholder="Letra" class="w-24 px-3 py-3 rounded-lg card outline-none font-mono text-lg uppercase text-center">
        <button id="writeSubmit" class="btn-accent px-6 rounded-lg font-semibold text-sm">Responder</button>
      </div>`;
  }
  return `<div class="flex-1 flex flex-col">
    ${header(true)}
    ${gauge()}
    <main class="flex-1 max-w-2xl w-full mx-auto px-5 py-4 fade-in" id="examMain">
      <div class="tag inline-block px-3 py-1 rounded text-[11px] mb-4 font-mono">TMA-I · ${esc(q.s)} · N.º ${esc(q.n)}</div>
      <div class="text-[11px] font-mono mb-3" style="color:var(--muted)">Pregunta ${state.idx+1} de ${state.pool.length}</div>
      <h2 class="text-lg font-medium mb-6 leading-snug">${esc(q.q)}</h2>
      <div id="optionsWrap">${body}</div>
      <div id="feedbackWrap"></div>
    </main>
  </div>`;
}

function evaluate(userKey){
  if(state.locked)return;
  state.locked=true;
  const q=state.pool[state.idx];
  const correct=userKey===q.a;
  if(correct)state.score++;
  state.answers.push({s:q.s,n:q.n,correct,userKey:userKey||null,correctKey:q.a});
  document.querySelectorAll(".opt").forEach(el=>{
    el.classList.add("pointer-events-none");
    if(el.dataset.key===q.a)el.classList.add("correct");
    else if(el.dataset.key===userKey)el.classList.add("wrong");
  });
  const fb=document.getElementById("feedbackWrap");
  fb.innerHTML=`<div class="mt-5 p-4 rounded-lg fade-in" style="background:${correct?"var(--accentSoft)":"color-mix(in srgb,var(--danger) 12%,var(--surface))"}">
    <div class="font-semibold text-sm mb-1" style="color:${correct?"var(--accent)":"var(--danger)"}">${correct?"Correcto":"Incorrecto"}</div>
    <div class="text-sm" style="color:var(--muted)">Respuesta correcta: <strong style="color:var(--text)">${q.a}. ${esc(q.o[q.a])}</strong></div>
    <button id="btnNext" class="btn-accent px-6 py-2.5 rounded-lg font-semibold text-sm mt-4">${state.idx+1<state.pool.length?"Siguiente":"Ver resultados"}</button>
  </div>`;
  document.getElementById("btnNext").onclick=()=>{
    state.idx++;state.locked=false;
    if(state.idx>=state.pool.length)finishExam();else render();
  };
  document.getElementById("btnNext").scrollIntoView({behavior:"smooth",block:"center"});
}

function bindExamEvents(){
  document.getElementById("btnTheme").onclick=toggleTheme;
  document.getElementById("btnBack").onclick=()=>{if(confirm("¿Salir del examen? Se perderá el progreso."))
  {state.screen="setup";render()}};
  document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>evaluate(el.dataset.key));
  const ws=document.getElementById("writeSubmit");
  if(ws){
    const submit=()=>{
      const val=normalize(document.getElementById("writeInput").value||"");
      evaluate(val.length===1?val:"?");
    };
    ws.onclick=submit;
    document.getElementById("writeInput").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
  }
}

function finishExam(){
  const total=state.pool.length;
  const pct=Math.round(state.score/total*100);
  const session={id:Date.now(),name:state.config.name,mode:state.config.mode,total,correct:state.score,pct,date:new Date().toISOString(),answers:state.answers};
  pushHistory(session);
  state.lastSession=session;
  state.screen="results";render();
}

function viewResults(){
  const s=state.lastSession;
  const pass=s.pct>=70;
  const wrong=s.answers.filter(a=>!a.correct);
  const bySection={};
  s.answers.forEach(a=>{bySection[a.s]=bySection[a.s]||{c:0,t:0};bySection[a.s].t++;if(a.correct)bySection[a.s].c++});
  return `<div class="flex-1 flex flex-col">
    ${header(false)}
    <main class="flex-1 max-w-2xl w-full mx-auto px-5 py-8 fade-in">
      <div class="tag inline-block px-3 py-1 rounded text-[11px] mb-4">RESULTADO · ${esc(s.name).toUpperCase()}</div>
      <h1 class="font-display text-4xl font-semibold mb-1">${s.pct}%</h1>
      <div class="text-sm font-semibold mb-6" style="color:${pass?"var(--accent)":"var(--danger)"}">${pass?"APROBADO":"NO APROBADO"} · ${s.correct} de ${s.total} correctas</div>

      <div class="space-y-2 mb-8">
        ${Object.entries(bySection).map(([sec,v])=>`
          <div class="flex items-center justify-between text-sm">
            <span style="color:var(--muted)">${esc(sec)}</span>
            <span class="font-mono">${v.c}/${v.t}</span>
          </div>`).join("")}
      </div>

      ${wrong.length?`<h3 class="font-display text-lg font-semibold mb-3">Preguntas a repasar (${wrong.length})</h3>
      <div class="space-y-3 mb-8">
        ${wrong.map(w=>{
          const q=DB.find(x=>x.s===w.s&&x.n===w.n);
          if(!q)return"";
          return `<div class="card p-4 rounded-lg text-sm">
            <div class="tag inline-block px-2 py-0.5 rounded text-[10px] mb-2">${esc(q.s)} · N.º ${esc(q.n)}</div>
            <div class="mb-2">${esc(q.q)}</div>
            <div style="color:var(--accent)">Correcta: ${q.a}. ${esc(q.o[q.a])}</div>
          </div>`;
        }).join("")}
      </div>`:""}

      <button id="btnRetry" class="btn-accent w-full py-4 rounded-lg font-semibold text-base mb-3">Nuevo examen</button>
      <button id="btnHistory2" class="btn-outline w-full py-3 rounded-lg text-sm">Ver historial</button>
    </main>
  </div>`;
}

function viewHistory(){
  const hist=getHistory();
  return `<div class="flex-1 flex flex-col">
    ${header(true)}
    <main class="flex-1 max-w-2xl w-full mx-auto px-5 py-8 fade-in">
      <h1 class="font-display text-2xl font-semibold mb-6">Historial de intentos</h1>
      ${hist.length?hist.map(h=>`
        <div class="card p-4 rounded-lg mb-3 flex items-center justify-between">
          <div>
            <div class="font-semibold text-sm">${esc(h.name)}</div>
            <div class="text-[11px] font-mono" style="color:var(--muted)">${new Date(h.date).toLocaleString("es-VE")} · ${h.mode}</div>
          </div>
          <div class="text-right">
            <div class="font-display text-xl font-semibold" style="color:${h.pct>=70?"var(--accent)":"var(--danger)"}">${h.pct}%</div>
            <div class="text-[11px] font-mono" style="color:var(--muted)">${h.correct}/${h.total}</div>
          </div>
        </div>`).join(""):`<p class="text-sm" style="color:var(--muted)">Aún no tienes intentos registrados.</p>`}
      ${hist.length?`<button id="btnClearHistory" class="btn-outline w-full py-3 rounded-lg text-sm mt-4">Borrar historial</button>`:""}
    </main>
  </div>`;
}

function bindEvents(){
  if(state.screen==="setup")bindSetupEvents();
  else if(state.screen==="exam")bindExamEvents();
  else if(state.screen==="results"){
    document.getElementById("btnTheme").onclick=toggleTheme;
    document.getElementById("btnRetry").onclick=()=>{state.screen="setup";render()};
    document.getElementById("btnHistory2").onclick=()=>{state.screen="history";render()};
  }else if(state.screen==="history"){
    document.getElementById("btnTheme").onclick=toggleTheme;
    document.getElementById("btnBack").onclick=()=>{state.screen="setup";render()};
    const cb=document.getElementById("btnClearHistory");
    if(cb)cb.onclick=()=>{if(confirm("¿Borrar todo el historial?")){localStorage.removeItem(STORE_KEY);render()}};
  }
}

loadTheme();
render();
</script>
</body>
</html>
